version: "3.9"

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: sd_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - sd_net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sd_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_NUM_PARTITIONS: 4
    networks:
      - sd_net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: sd_redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 200mb
      --maxmemory-policy allkeys-lru
      --save ""
    networks:
      - sd_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  response_generator:
    build: ./response_generator
    container_name: sd_response_generator
    environment:
      - DATASET_PATH=/data/open_buildings_rm.csv
      - PORT=8001
      - FAIL_RATE=0.3
    volumes:
      - ./data:/data:ro
    ports:
      - "8001:8001"
    networks:
      - sd_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  cache_service:
    build: ./cache_service
    container_name: sd_cache
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RESPONSE_GENERATOR_URL=http://response_generator:8001
      - METRICS_URL=http://metrics:8003
      - TTL=300
      - PORT=8002
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
      response_generator:
        condition: service_healthy
    networks:
      - sd_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  metrics:
    build: ./metrics
    container_name: sd_metrics
    environment:
      - PORT=8003
      - DB_PATH=/metrics/metrics.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EVICTION_POLL_INTERVAL=15
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - metrics_data:/metrics
    ports:
      - "8003:8003"
    networks:
      - sd_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka_consumer:
    build: ./kafka_consumer
    container_name: sd_consumer_1
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CACHE_URL=http://cache_service:8002
      - METRICS_URL=http://metrics:8003
      - CONSUMER_GROUP=query-consumers
      - MAX_RETRIES=3
      - CONSUMER_ID=1
    depends_on:
      kafka:
        condition: service_healthy
      cache_service:
        condition: service_healthy
      metrics:
        condition: service_healthy
    networks:
      - sd_net

