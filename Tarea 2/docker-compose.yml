  traffic_generator:
    build: ./traffic_generator
    container_name: sd_traffic
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - METRICS_URL=http://metrics:8003
      - CACHE_URL=http://cache_service:8002
      - DISTRIBUTION=zipf
      - ZIPF_S=1.2
      - TOTAL_REQUESTS=1000
      - CONCURRENCY=10
      - USE_KAFKA=true
      - SPIKE_ENABLED=true
      - SPIKE_REQUESTS=500
      - SPIKE_AFTER=500
    depends_on:
      kafka:
        condition: service_healthy
      metrics:
        condition: service_healthy
      cache_service:
        condition: service_healthy
    networks:
      - sd_net

volumes:
  metrics_data:

networks:
  sd_net:
    driver: bridge
